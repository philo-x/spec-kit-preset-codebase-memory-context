schema_version: "1.0"

preset:
  id: "codebase-memory-context"
  name: "Verified Codebase Context"
  version: "1.1.0"
  description: "Generate evidence-qualified repository context and use it across planning, tasks, analysis, and implementation"
  author: "Xu Yin (philo-x)"
  repository: "https://github.com/philo-x/spec-kit-preset-codebase-memory-context"
  license: "MIT"

requires:
  speckit_version: ">=1.1.2"

provides:
  templates:
    - type: "command"
      name: "speckit.codebase-memory"
      file: "commands/speckit.codebase-memory.md"
      description: "Generate or refresh evidence-qualified repository context"
      strategy: "replace"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Use repository context while planning a feature"
      strategy: "replace"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Use repository context while generating tasks"
      strategy: "replace"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Check design artifacts against repository context before implementation"
      strategy: "replace"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Use repository context while implementing tasks"
      strategy: "replace"

    - type: "template"
      name: "codebase-context-template"
      file: "templates/codebase-context-template.md"
      description: "Stable output structure for evidence-qualified repository context"
      strategy: "replace"

tags:
  - "code-intelligence"
  - "codebase-memory"
  - "architecture"
  - "workflow"
