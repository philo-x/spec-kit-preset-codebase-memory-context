name: Publish clean preset
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate tag and run base checks
        run: |
          python -c "import os,yaml; assert os.environ['GITHUB_REF_NAME'] == 'v'+yaml.safe_load(open('preset.yml'))['preset']['version']"
          python -m pytest -m 'not backend'
      - name: Build clean distribution
        run: python tools/package_preset.py --output-dir dist
      - name: Publish asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/codebase-memory-context.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
      - name: Download published asset and verify installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern codebase-memory-context.zip --dir downloaded
          cmp dist/codebase-memory-context.zip downloaded/codebase-memory-context.zip
          python tools/verify_archive.py downloaded/codebase-memory-context.zip
