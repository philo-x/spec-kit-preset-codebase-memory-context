name: Test preset

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-base:
    name: Base Validation (No Backend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install base dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify no backend is installed in base environment
        run: |
          ! which codebase-memory-mcp
      - name: Run base tests (excluding optional backend)
        run: python -m pytest -m "not backend"

  test-optional-backend:
    name: Optional Backend Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-backend.txt
      - name: Install test dependencies and optional backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-backend.txt
      - name: Verify pinned codebase-memory backend
        run: |
          python -m pip show codebase-memory-mcp
          codebase-memory-mcp --version
      - name: Run backend contract tests
        env:
          PRESET_REQUIRE_BACKEND: "1"
        run: python -m pytest -m "backend"
